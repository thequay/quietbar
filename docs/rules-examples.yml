# Examples of quietbar rules, for plugins that don't exist. They show every
# rule key at work; see README.md for what each means. The real config for the
# bundled plugins is ../config.yml.

# Folder the relative `path`s start from. Default: the folder install.sh puts
# the bundled plugins in.
# dir: ~/SwiftBar/Plugins/.quietbar/modules

# timeout: 15            # seconds a plugin gets before it counts as "no answer"
# icon: circle.grid.2x2  # SF Symbol shown when nothing is wrong
# separator: ": "        # between the section name and its summary

sections:
  # Simplest form: the plugin's title text is the summary, and a title colour
  # of red or orange/yellow raises an alert labelled with that title text.
  - name: Disk
    path: disk.5m.sh

  # Custom summary from the title, plus an alert read from the menu body.
  # The row becomes "Docker: 5 running · 2 unhealthy", and the menu bar shows
  # "docker 2 unhealthy" until they are fixed.
  - name: Docker
    path: docker.1m.sh
    summary:
      - { title: '(\d+) running', text: '{1} running' }
    alerts:
      - body: '^Unhealthy \((?<n>\d+)\)'
        level: critical
        label: 'docker {n} unhealthy'
        suffix: ' · {n} unhealthy'

  # Alert on a word in the title, whatever colour it has.
  - name: Deploys
    path: deploys.5m.py
    alerts:
      - { title: 'FAILED', level: critical, label: deploy failed }

  # Only a red title counts here, and a leading "●" is dropped from the text.
  - name: VPN
    path: vpn.10s.sh
    title_strip: '\A●\s*'
    alerts:
      - { color: critical, label: vpn down }

  # Slow plugin with its own timeout; never raises an alert.
  - name: Calendar
    path: next-event.1m.sh
    timeout: 5
    alerts: false

  # A plugin that may not be installed yet: `setup` is shown instead of "not found".
  - name: Backup
    path: backup.1h.sh
    setup: 'Not installed. Copy backup.1h.sh next to the other plugins.'
